<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📺 שיעורי יוטיוב — כתובים כספר | קול תודה</title>
<meta name="description" content="שיעורי הרב יהודה טאוב מערוץ היוטיוב — מתומללים, ערוכים ומסודרים לקריאה">
<style>
:root{--pink-1:#ff6b9d;--pink-2:#c62b6b;--purple-1:#a78bfa;--purple-2:#6d28d9;--blue-1:#60d3ff;--blue-2:#1e88b8;--amber-1:#ffd166;--amber-2:#e08e00;--bg:#fff7fb;--card:#fff;--ink:#3a2545;--ink-soft:#6b5a76;--shadow:0 10px 30px rgba(198,43,107,.14);--shadow-hi:0 18px 44px rgba(198,43,107,.24);}
*{box-sizing:border-box;}html,body{margin:0;padding:0;}
body{font-family:"Varela Round","Segoe UI",Arial,sans-serif;background:radial-gradient(circle at 8% 0%,#ffe3ef 0,transparent 45%),radial-gradient(circle at 100% 10%,#e3f4ff 0,transparent 40%),var(--bg);color:var(--ink);min-height:100vh;}
a{color:inherit;}
header.hero{padding:52px 20px 86px;text-align:center;background:linear-gradient(135deg,var(--pink-1),var(--purple-1) 55%,var(--blue-1));color:#fff;position:relative;overflow:hidden;}
header.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 18px,transparent 18px 36px);pointer-events:none;}
header.hero::after{content:"📜 📖 ✡️ 🕯️ 🍭";position:absolute;bottom:14px;left:0;right:0;font-size:1.3rem;letter-spacing:.8em;opacity:.35;}
.hero-inner{position:relative;}
header.hero h1{margin:0 0 10px;font-size:clamp(1.9rem,5vw,3rem);font-weight:800;text-shadow:0 3px 12px rgba(0,0,0,.15);}
header.hero p{margin:0 auto;max-width:620px;font-size:1.1rem;opacity:.95;line-height:1.6;}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px;}
.stat{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 16px;font-weight:700;font-size:.9rem;}
.wrap{max-width:1180px;margin:-56px auto 0;padding:0 18px 70px;position:relative;}
.toolbar{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:26px;}
#search{width:100%;padding:13px 20px;border-radius:999px;border:2px solid #ffd7e6;font-family:inherit;font-size:1rem;outline:none;background:#fff8fb;}
#search:focus{border-color:var(--pink-1);}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.chip{border:2px solid #f3dbe8;background:#fff;border-radius:999px;padding:6px 14px;font-family:inherit;font-size:.88rem;font-weight:700;color:var(--ink-soft);cursor:pointer;transition:.15s;}
.chip:hover{border-color:var(--pink-1);color:var(--pink-2);}
.chip.on{background:linear-gradient(135deg,var(--pink-1),var(--purple-1));border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(198,43,107,.25);}
.chip .n{opacity:.7;font-weight:400;margin-inline-start:4px;}
.section-title{font-size:1.05rem;color:var(--pink-2);margin:0 4px 12px;font-weight:800;}
.featured{display:flex;gap:22px;align-items:center;background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:26px 28px;margin-bottom:30px;text-decoration:none;border-inline-start:8px solid var(--c1);transition:.2s;}
.featured:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi);}
.featured .big-icon{flex:0 0 96px;height:96px;border-radius:26px;display:grid;place-items:center;font-size:3.2rem;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 8px 20px rgba(0,0,0,.12);}
.featured h2{margin:6px 0 6px;font-size:clamp(1.3rem,3vw,1.8rem);}
.featured p{margin:0 0 10px;color:var(--ink-soft);line-height:1.6;font-size:1.02rem;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px;}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border-radius:22px;box-shadow:var(--shadow);text-decoration:none;overflow:hidden;transition:.2s;}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-hi);}
.card .band{height:84px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;background:linear-gradient(135deg,var(--c1),var(--c2));position:relative;}
.card .band::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.1) 0 14px,transparent 14px 28px);}
.card .body{padding:16px 18px 14px;display:flex;flex-direction:column;gap:8px;flex:1;}
.card h3{margin:0;font-size:1.15rem;line-height:1.4;}
.card p{margin:0;color:var(--ink-soft);font-size:.92rem;line-height:1.6;}
.cat{display:inline-block;align-self:flex-start;font-size:.75rem;font-weight:800;color:var(--c2);background:color-mix(in srgb,var(--c1) 18%,#fff);border-radius:999px;padding:3px 10px;}
.tags{display:flex;gap:6px;flex-wrap:wrap;}
.tag{font-size:.75rem;background:#f6f1ff;color:var(--purple-2);border-radius:8px;padding:2px 8px;}
.card .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;border-top:1px dashed #f0d7e4;font-size:.8rem;color:var(--ink-soft);}
.card .go{font-weight:800;color:var(--pink-2);}
.dates{font-size:.8rem;color:var(--ink-soft);}
.editing{position:absolute;top:12px;inset-inline-start:12px;background:rgba(255,255,255,.9);color:var(--ink-soft);font-weight:700;font-size:.72rem;padding:3px 10px;border-radius:999px;z-index:1;}
.new{position:absolute;top:12px;inset-inline-end:12px;background:#fff;color:var(--pink-2);font-weight:800;font-size:.72rem;padding:3px 10px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.15);z-index:1;}
.msg{text-align:center;color:var(--ink-soft);padding:50px 10px;font-size:1.05rem;}
footer{text-align:center;color:var(--ink-soft);font-size:.85rem;padding:10px 0 40px;}
@media (max-width:640px){.featured{flex-direction:column;text-align:center;}.featured .big-icon{flex-basis:auto;width:84px;height:84px;}.cat{align-self:center;}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner">
  <h1>📺 שיעורי יוטיוב — כתובים כספר</h1>
  <p>כל שיעור שנמסר — מתומלל, ערוך ומסודר לקריאה, עם פרקים, חיפוש וקישור לכל רעיון</p>
  <div class="stats" id="stats"></div>
</div></header>
<div class="wrap">
  <div class="toolbar">
    <input type="search" id="search" placeholder="🔍 חיפוש שיעור — נושא, חג, פרשה, מושג...">
    <div class="chips" id="chips"></div>
  </div>
  <div id="featuredBox"></div>
  <div class="section-title" id="gridTitle"></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg">טוען את השיעורים... ⏳</div>
</div>
<footer>🍭 קול תודה — לומדים ורואים גאולה</footer>
<script>
(function(){
  var PALETTE = {"חגים ומועדים":["#ff6b9d","#c62b6b"],"פרשת השבוע":["#a78bfa","#6d28d9"],"גמרא":["#60d3ff","#1e88b8"],"הלכה":["#34d399","#047857"],
    "אמונה ומחשבה":["#ffd166","#e08e00"],"מוסר ומידות":["#fb923c","#c2410c"],"סיפורי צדיקים":["#f472b6","#9d174d"],"תפילה":["#818cf8","#4338ca"],"אחר":["#94a3b8","#475569"]};
  var all = [], cat = "", q = "";
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function colors(c){ return PALETTE[c] || PALETTE["אחר"]; }
  function gem(n){
    var s = "", H = [[400,"ת"],[300,"ש"],[200,"ר"],[100,"ק"]], T = ["","י","כ","ל","מ","נ","ס","ע","פ","צ"], O = ["","א","ב","ג","ד","ה","ו","ז","ח","ט"];
    n = n % 1000;
    H.forEach(function(h){ while (n >= h[0]) { s += h[1]; n -= h[0]; } });
    if (n === 15) s += "טו"; else if (n === 16) s += "טז"; else s += T[Math.floor(n / 10)] + O[n % 10];
    return s.length > 1 ? s.slice(0, -1) + "״" + s.slice(-1) : s + "׳";
  }
  function hebDate(d){
    try {
      return new Intl.DateTimeFormat("he-IL-u-ca-hebrew",{day:"numeric",month:"long",year:"numeric"}).formatToParts(d).map(function(x){
        return (x.type === "day" || x.type === "year") && /^\d+$/.test(x.value) ? gem(parseInt(x.value, 10)) : x.value;
      }).join("");
    } catch(e){ return ""; }
  }
  function greg(d){ try { return new Intl.DateTimeFormat("he-IL",{day:"numeric",month:"long",year:"numeric"}).format(d); } catch(e){ return d.toISOString().slice(0,10); } }
  function isNew(d){ return Date.now() - d.getTime() < 7 * 864e5; }
  function href(l){ return encodeURIComponent(l.file); }
  function text(l){ return [l.title, l.subtitle, l.category].concat(l.tags || [], l.cards || []).join(" ").toLowerCase(); }
  function tagsHtml(l){ return (l.tags || []).length ? '<div class="tags">' + l.tags.map(function(t){ return '<span class="tag">#' + esc(t) + "</span>"; }).join("") + "</div>" : ""; }
  function card(l){
    var d = new Date(l.date), c = colors(l.category);
    return '<a class="card" href="' + href(l) + '" style="--c1:' + c[0] + ";--c2:" + c[1] + '">' +
      (isNew(d) ? '<span class="new">✨ חדש</span>' : "") +
      (l.edited === false ? '<span class="editing" title="הספר הערוך יעלה בקרוב">⏳ בעריכה</span>' : "") +
      '<div class="band">' + esc(l.icon || "📖") + "</div>" +
      '<div class="body"><span class="cat">' + esc(l.category || "אחר") + "</span>" +
      "<h3>" + esc(l.title) + "</h3>" + (l.subtitle ? "<p>" + esc(l.subtitle) + "</p>" : "") + tagsHtml(l) +
      '<div class="foot"><span class="dates">' + esc(hebDate(d) || greg(d)) + "</span>" +
      '<span class="go">' + (l.cards ? l.cards.length + " נושאים · " : "") + "לקריאה ⟵</span></div></div></a>";
  }
  function featured(l){
    var d = new Date(l.date), c = colors(l.category);
    return '<div class="section-title">✨ מתחילים כאן</div><a class="featured" href="' + href(l) + '" style="--c1:' + c[0] + ";--c2:" + c[1] + '">' +
      '<div class="big-icon">' + esc(l.icon || "📖") + "</div><div>" +
      '<span class="cat">' + esc(l.category || "אחר") + "</span><h2>" + esc(l.title) + "</h2>" +
      (l.subtitle ? "<p>" + esc(l.subtitle) + "</p>" : "") + tagsHtml(l) +
      '<div class="dates" style="margin-top:8px">📅 ' + esc(hebDate(d)) + " · " + esc(greg(d)) + "</div></div></a>";
  }
  function chips(){
    var counts = {}; all.forEach(function(l){ counts[l.category || "אחר"] = (counts[l.category || "אחר"] || 0) + 1; });
    var keys = Object.keys(counts).sort(function(a,b){ return counts[b] - counts[a]; });
    var html = '<button class="chip' + (cat ? "" : " on") + '" data-c="">הכל<span class="n">' + all.length + "</span></button>";
    keys.forEach(function(k){ html += '<button class="chip' + (cat === k ? " on" : "") + '" data-c="' + esc(k) + '">' + esc(k) + '<span class="n">' + counts[k] + "</span></button>"; });
    document.getElementById("chips").innerHTML = html;
  }
  function render(){
    var list = all.filter(function(l){ return (!cat || (l.category || "אחר") === cat) && (!q || text(l).indexOf(q) !== -1); });
    var showFeatured = !cat && !q && all.length > 1;
    document.getElementById("featuredBox").innerHTML = showFeatured ? featured(all[0]) : "";
    var rest = showFeatured ? list.slice(1) : list;
    document.getElementById("gridTitle").textContent = showFeatured ? "📚 שאר השיעורים" : (list.length ? list.length + " שיעורים" : "");
    document.getElementById("grid").innerHTML = rest.map(card).join("");
    var msg = document.getElementById("msg");
    msg.style.display = list.length ? "none" : "block";
    msg.textContent = all.length ? "לא נמצאו שיעורים 🔍" : "עוד אין כאן שיעורים — הראשון בדרך 🍭";
    chips();
  }
  document.getElementById("chips").addEventListener("click", function(e){
    var b = e.target.closest(".chip"); if (!b) return;
    cat = b.getAttribute("data-c"); render();
  });
  document.getElementById("search").addEventListener("input", function(e){ q = e.target.value.trim().toLowerCase(); render(); });
  fetch("lessons.json?t=" + Date.now(), {cache:"no-store"}).then(function(r){ if (!r.ok) throw 0; return r.json(); }).then(function(d){
    all = (d.lessons || []).slice().sort(function(a,b){ var x = a.series_order, y = b.series_order; if (x != null && y != null) return x - y; if (x != null) return -1; if (y != null) return 1; return new Date(b.date) - new Date(a.date); });
    var cats = {}; all.forEach(function(l){ cats[l.category] = 1; });
    document.getElementById("stats").innerHTML = '<span class="stat">📖 ' + all.length + " שיעורים</span>" +
      '<span class="stat">🗂️ ' + Object.keys(cats).length + " נושאים</span>" +
      (d.updated ? '<span class="stat">🕒 עודכן ' + esc(hebDate(new Date(d.updated)) || greg(new Date(d.updated))) + "</span>" : "");
    render();
  }).catch(function(){ all = []; render(); });
})();
</script>
</body>
</html>
