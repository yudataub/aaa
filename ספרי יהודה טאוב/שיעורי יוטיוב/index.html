  var PAL = [["#ff6b9d","#c62b6b"],["#ffb347","#e07a00"],["#a78bfa","#6d28d9"],["#60d3ff","#1e88b8"],["#818cf8","#4338ca"],["#f472b6","#9d174d"],
             ["#d4a373","#8a5a2b"],["#fb7185","#be123c"],["#34d399","#047857"],["#facc15","#b45309"],["#38bdf8","#0369a1"],["#f472b6","#be185d"],
             ["#86efac","#15803d"],["#93c5fd","#1d4ed8"],["#94a3b8","#475569"]];
  var D = null, topic = "", q = "", ART = {}, LIMIT = 60, shown = LIMIT;
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function col(t){ var i = 0; D.topics.forEach(function(x, n){ if (x.k === t) i = n; }); return PAL[i % PAL.length]; }
  function emo(t){ var e = ""; D.topics.forEach(function(x){ if (x.k === t) e = x.e; }); return e; }
  function sid(s){ return "s-" + s.replace(/[\s"'״׳,–]+/g, "-"); }
  function norm(s){ return String(s || "").replace(/[֑-ׇ]/g, "").replace(/["'״׳]/g, "").toLowerCase(); }
  function subIn(l, t){ if (l.tp === t) return l.sb; var m = (l.m || []).filter(function(x){ return x[0] === t; })[0]; return m ? m[1] : null; }
  function href(l){ return encodeURIComponent(l.file); }
  function vid(l){ var m = String(l.video || "").match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/)([\w-]{11})/); return m ? m[1] : ""; }
  function pic(l){ var v = vid(l); return (v && ART[v]) || ART[l.file] || (v ? "https://i.ytimg.com/vi/" + v + "/mqdefault.jpg" : ""); }
  function card(l, sb){
    var c = col(l.tp), p = pic(l); sb = sb || l.sb;
    var book = (l.tags || []).indexOf("חוברת להדפסה") >= 0;
    return '<a class="card" href="' + href(l) + '" style="--c1:' + c[0] + ';--c2:' + c[1] + '">' +
      '<div class="pic">' + (p ? '<img src="' + esc(p) + '" alt="" loading="lazy">' : esc(l.icon || emo(l.tp))) + "</div>" +
      '<div class="body"><span class="cat">' + esc(emo(l.tp) + " " + sb) + "</span><h3>" + esc((l.icon ? l.icon + " " : "") + l.title) + "</h3>" +
      "<p>" + esc(l.subtitle || "") + "</p>" +
      '<div class="foot"><span>' + (book ? "📄 חוברת להדפסה" : (l.cards ? "📖 " + l.cards.length + " נושאים" : "📖 ספר")) + '</span><span class="go">לקריאה ⟵</span></div></div></a>';
  }
  function counts(){ var c = {}; D.lessons.forEach(function(l){ c[l.tp] = (c[l.tp] || 0) + 1; (l.m || []).forEach(function(x){ if (x[0] !== l.tp) c[x[0]] = (c[x[0]] || 0) + 1; }); }); return c; }
  function chips(){
    var c = counts();
    $("chips").innerHTML = '<button class="chip' + (topic ? "" : " on") + '" data-t="">🏠 כל הנושאים<span class="n">' + D.lessons.length + "</span></button>" +
      D.topics.filter(function(t){ return c[t.k]; }).map(function(t){
        return '<button class="chip' + (topic === t.k ? " on" : "") + '" data-t="' + esc(t.k) + '">' + esc(t.e + " " + t.k) + '<span class="n">' + c[t.k] + "</span></button>"; }).join("");
  }
  function subsOf(t){   // תתי-הנושאים בסדר הקבוע, ואחריהם כל מה שהופיע בנתונים ולא ברשימה
    var seen = {}, out = t.subs.slice();
    D.lessons.forEach(function(l){ var s = subIn(l, t.k); if (s && out.indexOf(s) < 0 && !seen[s]) { seen[s] = 1; out.push(s); } });
    return out;
  }
  function home(){
    var c = counts();
    $("gridTitle").textContent = "📚 בחרו נושא";
    $("subtoc").innerHTML = "";
    $("view").innerHTML = '<div class="topics">' + D.topics.filter(function(t){ return c[t.k]; }).map(function(t){
      var p = col(t.k), has = {};
      D.lessons.forEach(function(l){ var s = subIn(l, t.k); if (s) has[s] = (has[s] || 0) + 1; });
      var subs = subsOf(t).filter(function(s){ return has[s]; });
      if (t.k === "פרשת השבוע") subs = ["בראשית","שמות","ויקרא","במדבר","דברים"].map(function(b){ return "חומש " + b; });
      var more = subs.length > 8 ? '<span>ועוד ' + (subs.length - 8) + "...</span>" : "";
      return '<button class="topic" data-t="' + esc(t.k) + '" style="--c1:' + p[0] + ';--c2:' + p[1] + '"><div class="band">' + t.e + '<span class="cnt">' + c[t.k] + ' שיעורים</span></div>' +
        '<div class="tb"><h3>' + esc(t.k) + '</h3><div class="subs">' + subs.slice(0, 8).map(function(s){ return "<span>" + esc(s) + "</span>"; }).join("") + more + "</div></div></button>"; }).join("") + "</div>";
  }
  function topicView(){
    var t = D.topics.filter(function(x){ return x.k === topic; })[0], by = {};
    D.lessons.forEach(function(l){ var s = subIn(l, topic); if (s) (by[s] = by[s] || []).push(l); });
    var subs = subsOf(t).filter(function(s){ return by[s]; });
    $("gridTitle").textContent = "";
    var toc = "";
    if (topic === "פרשת השבוע") {   // תוכן לפי חומש — כל פרשה שורה משלה
      toc = '<div class="subtoc"><b>' + esc(t.e + " " + t.k) + "</b>" + ["בראשית","שמות","ויקרא","במדבר","דברים"].map(function(b){
        var ps = subs.filter(function(p){ return CHUMASH[p] === b; });
        return ps.length ? '<div class="row"><span class="bk">חומש ' + b + "</span>" + ps.map(function(s){ return '<a href="#' + sid(s) + '" data-s="' + sid(s) + '">' + esc(s) + '<span class="n">' + by[s].length + "</span></a>"; }).join("") + "</div>" : ""; }).join("") +
        (by["פרשות שונות"] ? '<div class="row"><a href="#' + sid("פרשות שונות") + '" data-s="' + sid("פרשות שונות") + '">פרשות שונות<span class="n">' + by["פרשות שונות"].length + "</span></a></div>" : "") + "</div>";
    } else if (subs.length > 1) {
      toc = '<div class="subtoc"><b>' + esc(t.e + " " + t.k) + "</b>" + subs.map(function(s){
        return '<a href="#' + sid(s) + '" data-s="' + sid(s) + '">' + esc(s) + '<span class="n">' + by[s].length + "</span></a>"; }).join("") + "</div>";
    }
    $("subtoc").innerHTML = toc;
    $("view").innerHTML = '<div class="grid">' + subs.map(function(s){
      return '<h2 class="ph" id="' + sid(s) + '">' + (topic === "פרשת השבוע" && s !== "פרשות שונות" ? "פרשת " : "") + esc(s) + '<span class="n">' + by[s].length + ' שיעורים</span>' + (subs.length > 1 ? '<a href="#top">⬆ לראש הנושא</a>' : "") + "</h2>" +
        by[s].map(function(l){ return card(l, s); }).join(""); }).join("") + "</div>";
  }
  function searchView(){
    var w = norm(q), hits = [];
    D.lessons.forEach(function(l){
      if (topic && !subIn(l, topic)) return;
      var head = norm([l.title, l.sb, l.tp].join(" ")), rest = norm([l.subtitle, (l.tags || []).join(" "), (l.cards || []).join(" ")].join(" "));
      if (head.indexOf(w) >= 0) hits.push([0, l]); else if (rest.indexOf(w) >= 0) hits.push([1, l]);
    });
    hits.sort(function(a, b){ return a[0] - b[0]; });
    $("subtoc").innerHTML = "";
    $("gridTitle").textContent = hits.length ? hits.length + " שיעורים נמצאו" : "";
    $("view").innerHTML = '<div class="grid">' + hits.slice(0, shown).map(function(h){ return card(h[1], topic ? subIn(h[1], topic) : ""); }).join("") + "</div>" +
      (hits.length > shown ? '<button class="more" id="more">עוד ' + (hits.length - shown) + " תוצאות</button>" : "");
    return hits.length;
  }
  function render(){
    chips();
    var n = 1;
    if (q.length >= 2) n = searchView(); else if (topic) topicView(); else home();
    var m = $("msg"); m.style.display = n ? "none" : "block"; m.textContent = "לא נמצאו שיעורים 🔍";
  }
  function go(t){
    topic = t; q = ""; $("search").value = ""; shown = LIMIT; render(); window.scrollTo({top: 0, behavior: "smooth"});
    try { history.replaceState(null, "", t ? "#t=" + encodeURIComponent(t) : location.pathname); } catch(e){}
  }
  document.addEventListener("click", function(e){
    var b = e.target.closest("[data-t]"); if (b) { e.preventDefault(); go(b.getAttribute("data-t")); return; }
    var s = e.target.closest("a[data-s]"); if (s) { e.preventDefault(); var h = $(s.getAttribute("data-s")); if (h) h.scrollIntoView({behavior: "smooth"}); return; }
    if (e.target.id === "more") { shown += LIMIT; render(); }
  });
  var tmr; $("search").addEventListener("input", function(e){ clearTimeout(tmr); tmr = setTimeout(function(){ q = e.target.value.trim(); shown = LIMIT; render(); }, 180); });
  var artP = fetch("art.json?t=" + Date.now(), {cache: "no-store"}).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; });
  fetch("lessons.json?t=" + Date.now(), {cache: "no-store"}).then(function(r){ if (!r.ok) throw 0; return r.json(); }).then(function(d){
    return artP.then(function(a){ ART = a || {}; return d; });
  }).then(function(d){
    var L = (d.lessons || []).slice().sort(function(a, b){
      var x = a.series_order, y = b.series_order; if (a.series && a.series === b.series && x != null && y != null) return x - y;
      return String(b.date || "").localeCompare(String(a.date || "")); });
    var fonts = [];
    L.forEach(function(l){ var r = classify(l); l.tp = r.tp; l.sb = r.sb; l.m = r.m;
      r.m.forEach(function(x){ if (x[0] === "חוברות להדפסה" && fonts.indexOf(x[1]) < 0) fonts.push(x[1]); }); });
    TOPICS.forEach(function(t){ if (t.k === "חוברות להדפסה") t.subs = fonts; });
    D = {topics: TOPICS, lessons: L};
    var cats = {}; L.forEach(function(l){ cats[l.tp] = 1; });
    $("stats").innerHTML = '<span class="stat">📖 ' + L.length + ' ספרים ושיעורים</span><span class="stat">🗂️ ' + Object.keys(cats).length + ' נושאים</span><span class="stat">🔍 חיפוש בכל השיעורים</span>';
    var m = decodeURIComponent(location.hash || "").match(/^#t=(.+)$/);
    topic = m && TOPICS.some(function(t){ return t.k === m[1]; }) ? m[1] : "";
    render();
  }).catch(function(){ $("msg").textContent = "לא הצלחנו לטעון את רשימת השיעורים"; });
})();

</script>
</body>
</html>
