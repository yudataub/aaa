<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ספר דיגיטלי - כיצד רץ הלל</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&display=swap');

  :root {
    --parchment: #faf3e6;
    --ink: #2e2a25;
    --gold: #c9a15a;
    --cream: #f2e8d3;
    --gold-dark: #a9813f;
    --shadow: rgba(46, 42, 37, 0.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    font-family: 'Frank Ruhl Libre', serif;
    background: var(--parchment);
    color: var(--ink);
    overflow: hidden;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 20%, rgba(201,161,90,0.06) 0%, transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(201,161,90,0.06) 0%, transparent 40%);
  }

  .view { position: fixed; inset: 0; display: none; }
  .view.active { display: flex; }

  #home-view {
    flex-direction: column;
    align-items: center;
    padding: 40px 20px;
    overflow-y: auto;
  }

  .home-header {
    text-align: center;
    max-width: 700px;
    margin-bottom: 40px;
  }

  .home-header .ornament {
    color: var(--gold);
    font-size: 1.4em;
    letter-spacing: 10px;
    margin-bottom: 10px;
  }

  .home-header h1 {
    font-size: 2.6em;
    font-weight: 700;
    color: var(--ink);
    border-bottom: 3px solid var(--gold);
    display: inline-block;
    padding-bottom: 14px;
    margin-bottom: 12px;
  }

  .home-header p {
    font-size: 1.15em;
    color: var(--gold-dark);
    font-style: italic;
  }

  .search-bar {
    width: 100%;
    max-width: 560px;
    margin: 0 auto 40px;
    position: relative;
  }

  .search-bar input {
    width: 100%;
    padding: 14px 50px 14px 20px;
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 1.05em;
    border: 2px solid var(--gold);
    border-radius: 30px;
    background: var(--cream);
    color: var(--ink);
    outline: none;
    transition: box-shadow 0.25s;
  }

  .search-bar input:focus {
    box-shadow: 0 0 0 4px rgba(201,161,90,0.25);
  }

  .search-bar .icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold-dark);
    font-size: 1.2em;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 22px;
    max-width: 980px;
    width: 100%;
  }

  .topic-card {
    background: var(--cream);
    border: 1.5px solid var(--gold);
    border-radius: 14px;
    padding: 26px 22px;
    cursor: pointer;
    transition: transform 0.25s, box-shadow 0.25s;
    position: relative;
    overflow: hidden;
  }

  .topic-card::before {
    content: "";
    position: absolute;
    top: 0; right: 0;
    width: 60px; height: 60px;
    background: radial-gradient(circle, rgba(201,161,90,0.18), transparent 70%);
  }

  .topic-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 14px 30px var(--shadow);
  }

  .topic-card .card-icon {
    font-size: 1.8em;
    color: var(--gold-dark);
    margin-bottom: 10px;
    display: block;
  }

  .topic-card h3 {
    font-size: 1.3em;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .topic-card p {
    font-size: 0.92em;
    color: #5b5348;
    line-height: 1.6;
  }

  .topic-card .card-footer {
    margin-top: 14px;
    font-size: 0.85em;
    color: var(--gold-dark);
    font-weight: 700;
  }

  #reader-view {
    flex-direction: column;
    background: var(--parchment);
  }

  .reader-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 2px solid var(--gold);
    background: var(--cream);
    flex-shrink: 0;
    gap: 14px;
  }

  .topbar-btn {
    background: none;
    border: 1.5px solid var(--gold);
    color: var(--gold-dark);
    border-radius: 8px;
    padding: 8px 16px;
    font-family: 'Frank Ruhl Libre', serif;
    font-size: 0.95em;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    white-space: nowrap;
  }

  .topbar-btn:hover { background: var(--gold); color: var(--parchment); }

  .reader-title {
    font-size: 1.15em;
    font-weight: 700;
    color: var(--ink);
    text-align: center;
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .progress-track {
    height: 5px;
    background: var(--cream);
    flex-shrink: 0;
    position: relative;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dark), var(--gold));
    transition: width 0.35s ease;
  }

  .reader-body {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
  }

  .toc-drawer {
    position: absolute;
    top: 0; right: 0;
    height: 100%;
    width: 300px;
    background: var(--cream);
    border-left: 2px solid var(--gold);
    transform: translateX(100%);
    transition: transform 0.3s ease;
    z-index: 20;
    overflow-y: auto;
    padding: 20px;
  }

  .toc-drawer.open { transform: translateX(0); }

  .toc-drawer h4 {
    color: var(--gold-dark);
    border-bottom: 2px solid var(--gold);
    padding-bottom: 10px;
    margin-bottom: 14px;
    font-size: 1.1em;
  }

  .toc-item {
    padding: 12px 10px;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 6px;
    transition: background 0.2s;
    font-size: 0.95em;
    color: var(--ink);
    border-right: 3px solid transparent;
  }

  .toc-item:hover { background: rgba(201,161,90,0.15); }
  .toc-item.active {
    background: rgba(201,161,90,0.25);
    border-right-color: var(--gold-dark);
    font-weight: 700;
  }

  .toc-item .toc-sub { display: block; font-size: 0.82em; color: var(--gold-dark); margin-top: 2px; }

  .toc-overlay {
    position: absolute;
    inset: 0;
    background: rgba(46,42,37,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 15;
  }

  .toc-overlay.show { opacity: 1; pointer-events: auto; }

  .page-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    perspective: 2200px;
    position: relative;
  }

  .page-sheet {
    width: min(760px, 92%);
    height: min(620px, 84vh);
    background: var(--parchment);
    border: 1.5px solid var(--gold);
    border-radius: 6px;
    box-shadow: 0 18px 45px var(--shadow), inset 0 0 60px rgba(201,161,90,0.05);
    padding: 44px 50px;
    overflow-y: auto;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1), opacity 0.5s;
  }

  .page-sheet::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(201,161,90,0.35);
    border-radius: 3px;
    pointer-events: none;
  }

  .page-sheet.flip-next { animation: flipNext 0.5s ease; }
  .page-sheet.flip-prev { animation: flipPrev 0.5s ease; }

  @keyframes flipNext {
    0% { transform: rotateY(0deg); opacity: 1; }
    45% { transform: rotateY(-85deg); opacity: 0.4; }
    50% { transform: rotateY(85deg); opacity: 0.4; }
    100% { transform: rotateY(0deg); opacity: 1; }
  }

  @keyframes flipPrev {
    0% { transform: rotateY(0deg); opacity: 1; }
    45% { transform: rotateY(85deg); opacity: 0.4; }
    50% { transform: rotateY(-85deg); opacity: 0.4; }
    100% { transform: rotateY(0deg); opacity: 1; }
  }

  .page-num-badge {
    position: absolute;
    top: -14px;
    right: 36px;
    background: var(--gold-dark);
    color: var(--parchment);
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 0.9em;
    box-shadow: 0 4px 10px var(--shadow);
  }

  .page-kicker {
    color: var(--gold-dark);
    font-size: 0.95em;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .page-sheet h2 {
    font-size: 1.9em;
    color: var(--ink);
    border-bottom: 2px solid var(--gold);
    padding-bottom: 14px;
    margin-bottom: 20px;
  }

  .page-sheet p {
    font-size: 1.05em;
    line-height: 1.95;
    text-align: justify;
    margin-bottom: 14px;
  }

  .page-sheet p.opening { font-size: 1.15em; font-weight: 500; color: var(--gold-dark); }

  .quote-block {
    background: var(--cream);
    border-right: 4px solid var(--gold);
    padding: 14px 20px;
    margin: 16px 0;
    font-size: 1.15em;
    font-weight: 500;
    border-radius: 6px;
  }

  .q-block, .a-block, .h-block {
    padding: 16px 20px;
    margin: 16px 0;
    border-radius: 8px;
    border-right: 4px solid var(--gold);
    background: rgba(201,161,90,0.08);
  }

  .q-label, .a-label, .h-label {
    display: block;
    font-weight: 700;
    color: var(--gold-dark);
    margin-bottom: 8px;
  }

  .dist-table {
    width: 100%;
    border-collapse: collapse;
    margin: 16px 0;
    border: 1.5px solid var(--gold);
  }

  .dist-table th {
    background: var(--gold-dark);
    color: var(--parchment);
    padding: 10px 14px;
    font-size: 1em;
  }

  .dist-table td {
    padding: 10px 14px;
    border-bottom: 1px solid rgba(201,161,90,0.4);
    background: var(--cream);
  }

  .source-block {
    background: var(--cream);
    border: 1px dashed var(--gold-dark);
    border-radius: 8px;
    padding: 20px 24px;
  }

  .source-title {
    text-align: center;
    font-weight: 700;
    color: var(--gold-dark);
    margin-bottom: 14px;
  }

  mark {
    background: var(--gold);
    color: var(--ink);
    padding: 0 3px;
    border-radius: 3px;
  }

  .nav-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: var(--cream);
    border: 1.5px solid var(--gold);
    color: var(--gold-dark);
    width: 46px; height: 46px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3em;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
    z-index: 5;
    user-select: none;
  }

  .nav-arrow:hover { background: var(--gold); color: var(--parchment); transform: translateY(-50%) scale(1.08); }
  .nav-arrow.disabled { opacity: 0.25; pointer-events: none; }
  .nav-arrow.prev { right: 14px; }
  .nav-arrow.next { left: 14px; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }
  ::-webkit-scrollbar-track { background: var(--cream); }

  @media (max-width: 640px) {
    .page-sheet { padding: 28px 22px; }
    .reader-title { display: none; }
    .toc-drawer { width: 82%; }
  }
</style>
</head>
<body>

<div id="home-view" class="view active">
  <div class="home-header">
    <div class="ornament">◆ ◆ ◆</div>
    <h1>ספרי יהודה טאוב</h1>
    <p>ספר דיגיטלי מתחלף — סוגיות בהלכה ובאגדה</p>
  </div>

  <div class="search-bar">
    <span class="icon">⛲</span>
    <input type="text" id="home-search" placeholder="חיפוש בתוך הספר...">
  </div>

  <div class="cards-grid" id="cards-grid"></div>
</div>

<div id="reader-view" class="view">
  <div class="reader-topbar">
    <button class="topbar-btn" id="btn-home">🏠 בית</button>
    <button class="topbar-btn" id="btn-toc">☰ תוכן</button>
    <div class="reader-title" id="reader-title">כיצד רץ הלל</div>
    <div class="search-bar" style="max-width:220px;margin:0;">
      <span class="icon" style="left:14px;font-size:1em;">⛲</span>
      <input type="text" id="reader-search" placeholder="חפש..." style="padding:8px 40px 8px 14px;font-size:0.9em;">
    </div>
  </div>

  <div class="progress-track">
    <div class="progress-fill" id="progress-fill" style="width:0%;"></div>
  </div>

  <div class="reader-body">
    <div class="toc-overlay" id="toc-overlay"></div>
    <div class="toc-drawer" id="toc-drawer">
      <h4>תוכן העניינים</h4>
      <div id="toc-list"></div>
    </div>

    <div class="page-stage">
      <div class="nav-arrow prev" id="nav-prev">›</div>
      <div class="page-sheet" id="page-sheet"></div>
      <div class="nav-arrow next" id="nav-next">‹</div>
    </div>
  </div>
</div>

<script>
const PAGES = [{"title": "פתיחה", "subtitle": "ראוי זה לחלל עליו את השבת", "body": "<p class=\"opening\">עיון בסוגיית יומא פ״ד ע״ב בעניין הלל הזקן, על יסוד הערות הגרי״ש אלישיב על מסכת יומא דף פה עמוד ב.</p>\n        <p>סוגיה זו עוסקת בשאלה יסודית ביחסי התורה ופיקוח נפש: מדוע ייחדה הגמרא את הלל הזקן בלשון \"ראוי <b>זה</b>\" לחלל עליו את השבת, בזמן שדין פיקוח נפש הוא דין כללי החל על כל אדם?</p>\n        <p>הדף הבא יעקוב אחר התפתחות הדיון: מהמעשה בגמרא, דרך הקושיה, תירוץ ה\"שבות יעקב\", ועד להשגת הגרי\"ש אלישיב עליו.</p>"}, {"title": "פרק א", "subtitle": "לשון הגמרא ותוכן המעשה", "body": "<p>הגמרא מספרת על הלל הזקן שהיה יושב ודורש, ובני אדם שהיו זקוקים לו נכנסו על הגג לשמוע את דבריו מבעד לארובה, מפני שלא יכלו להיכנס מרוב הקהל.</p>\n        <p>משום כך ירד עליו שלג וכיסה אותו, וכשלא נראה אור בבית המדרש בבוקר, עלו לגג ומצאוהו מכוסה בשלג שלושה אמות. הוציאוהו, הרחיצוהו והדליקו נגדו - על אף שהיה שבת.</p>\n        <div class=\"quote-block\">\"אמרו: <b>ראוי זה לחלל עליו את השבת</b>\"</div>\n        <p>חז\"ל קבעו שהלל היה במצב סכנת נפשות המחייב לחלל עליו את השבת - להצילו, לחממו ולהחיותו - אף שהדבר נעשה בשבת עצמה.</p>"}, {"title": "פרק ב", "subtitle": "הקושיה היסודית", "body": "<div class=\"q-block\"><span class=\"q-label\">מהי הקושיה?</span>\n        <p>לשון הגמרא \"<b>ראוי זה</b>\" מדגישה דבר תמוה: וכי <b>זה</b> ולא אחר? הרי כל אדם אחר שהיה בסכנת נפשות דומה - שקפא מקור ונקבר בשלג - היו חייבים לחלל עליו את השבת בדיוק כמו שחיללו על הלל!</p></div>\n        <p>מדוע הגמרא מנסחת את הדין כאילו הוא מיוחד ונתון להלל בפרט, ולא מסתפקת בקביעה כללית שכל חולה או אדם בסכנה - מחללים עליו את השבת?</p>\n        <p>דין פיקוח נפש שדוחה שבת הוא דין כללי החל על כל אדם באשר הוא, ואין בו שום ייחוד להלל. אם כך, מדוע נוקטת הגמרא בלשון \"ראוי <i>זה</i>\" כאילו קיים כאן דין ייחודי ופרטני?</p>"}, {"title": "פרק ג", "subtitle": "תירוץ ה\"שבות יעקב\"", "body": "<div class=\"a-block\"><span class=\"a-label\">חילוק בין סכנה שבאה מעצמה לסכנה שהכניס בה עצמו</span>\n        <p>בעל השבות יעקב (בהגהותיו על עין יעקב) מתרץ: הכלל שמחללים שבת על חולה שיש בו סכנה נאמר <b>רק</b> כאשר האדם נסתכן מעצמו - בדרך טבעית, ולא מרצונו החפשי.</p>\n        <p>אבל אדם ש<b>הכניס עצמו לסכנה</b> במו ידיו - ובוודאי המאבד עצמו לדעת - <b>אין מחללים עליו את השבת</b>, אף שמצד עצם הדין ראוי להצילו.</p></div>\n        <p>הלל עצמו הכניס את עצמו לסכנה - עלה על הגג וישב מעל הארובה בקור מפני צמאונו ללמוד תורה. הגמרא מדייקת ומלמדת שדווקא הלל, כיוון שנכנס לסכנה מצמאון לתורה, \"ראוי <i>זה</i>\" בייחוד לחלל עליו שבת - ולא כל אדם אחר שהכניס עצמו לסכנה מרצונו.</p>"}, {"title": "פרק ד", "subtitle": "השגת הגרי״ש אלישיב", "body": "<div class=\"h-block\"><span class=\"h-label\">אולם נראה דאין זה נכון...</span>\n        <p>הגרי\"ש אלישיב דוחה את תירוץ השבות יעקב: אף אם נכון הכלל שבמאבד עצמו לדעת ממש - מי שהביא סכנה במתכוון ומדעת - אין מחללים עליו שבת, הרי מקרה הלל שונה בתכלית.</p></div>\n        <p>הלל <b>לא</b> רצה להרוג את עצמו או לאבד עצמו לדעת. הוא רצה לעשות דבר חיובי - לשמוע תורה - ומתוך אותה השתוקקות עצומה נכנס בדרך אגב לסכנה, בלי ששם לב אליה ובלי שהתכוון אליה בכלל.</p>\n        <table class=\"dist-table\">\n        <tr><th>מאבד עצמו לדעת</th><th>מקרה הלל</th></tr>\n        <tr><td>מתכוון ומבקש להזיק לעצמו</td><td>מתכוון לדבר חיובי, לא לסכנה</td></tr>\n        <tr><td>מודע לסכנה וחפץ בה</td><td>לא נותן דעתו לסכנה מרוב רצון</td></tr>\n        <tr><td>אין מחללים עליו שבת</td><td>מחללים עליו שבת ככל מי שנסתכן</td></tr>\n        </table>\n        <p>לדעת הגרי\"ש אלישיב אין הבדל בין הלל לכל אדם שנכנס לסכנה מתוך עשיית דבר שרצה בו ולא שם לב לסכנה - \"המכניס עצמו לסכנה מסברא\" מחללים עליו את השבת.</p>"}, {"title": "פרק ה", "subtitle": "לשון המקור המלא", "body": "<div class=\"source-block\">\n        <p class=\"source-title\">הערות הגרי״ש אלישיב, מסכת יומא דף פה עמוד ב</p>\n        <p>אמרו ראוי זה לחלל עליו את השבת. ולכאורה וכי זה ולא אחר, והא כל אחר שהיה בסכנה נמי היו צריכים לחלל עליו את השבת. ומכח קושיא זו כתב השבו\"י [בעין יעקב] להוכיח דלעולם מה שמחללין השבת על חולה שיש בו סכנה - ה\"מ שחלה מעצמו, אבל אם הכניס עצמו לסכנה או המאבד עצמו לדעת אין מחללין עליו את השבת אף על פי שדין הוא להצילו. ומשו\"ה קאתי הגמ' לדייק דהוא הלל, כיון דעשאו דהוה צמא לתורה, מחללין עליו את השבת - וראוי זה לחלל עליו, אף על פי שאחרים בכה\"ג אין מחללין עליהם את השבת.</p>\n        <p>אולם נראה דאין זה נכון, דאפילו נאמר במאבד עצמו לדעת - דכיון שהביא עליו בידים סכנה זו ומדעתו - אפשר דאין מחללין עליו את השבת. מ\"מ בגוונא כה\"ג של הלל, דהיינו שאדם לא רצה להרוג ולאבד עצמו, אלא היה רצון לעשות דבר מסוים, ובעשיית דבר זה נכנס נמי לסכנה ולא חשש אותו אחד לסכנה - א\"כ אה\"נ דנתבע הוא למה נכנס לזה, מ\"מ אמאי אין מצילין אותו ואין מחללין עליו השבת, דרק לא חישב לסכנה מרוב רצונו לאותו דבר. וא\"כ המכניס עצמו לסכנה מסברא, נראה דמחללין עליו השבת.</p>\n        </div>"}];

let currentPage = 0;
let searchMatches = [];
let searchIndex = -1;

const homeView = document.getElementById('home-view');
const readerView = document.getElementById('reader-view');
const cardsGrid = document.getElementById('cards-grid');
const pageSheet = document.getElementById('page-sheet');
const tocList = document.getElementById('toc-list');
const tocDrawer = document.getElementById('toc-drawer');
const tocOverlay = document.getElementById('toc-overlay');
const progressFill = document.getElementById('progress-fill');
const readerTitle = document.getElementById('reader-title');

function buildHome() {
  const card = document.createElement('div');
  card.className = 'topic-card';
  card.innerHTML = `
    <span class="card-icon">📖</span>
    <h3>כיצד רץ הלל</h3>
    <p>קושיית הגמרא \"ראוי זה לחלל עליו את השבת\", תירוץ השבות יעקב, והשגת הגרי\"ש אלישיב על מסכת יומא.</p>
    <div class="card-footer">${PAGES.length} פרקים ›</div>
  `;
  card.addEventListener('click', () => openReader(0));
  cardsGrid.appendChild(card);
}

function buildTOC() {
  tocList.innerHTML = '';
  PAGES.forEach((p, i) => {
    const item = document.createElement('div');
    item.className = 'toc-item';
    item.dataset.index = i;
    item.innerHTML = `${p.title}<span class="toc-sub">${p.subtitle}</span>`;
    item.addEventListener('click', () => { goToPage(i); closeTOC(); });
    tocList.appendChild(item);
  });
}

function openReader(index) {
  homeView.classList.remove('active');
  readerView.classList.add('active');
  goToPage(index, false);
}

function renderPage(direction) {
  const p = PAGES[currentPage];
  pageSheet.innerHTML = `
    <div class="page-num-badge">${currentPage + 1}</div>
    <div class="page-kicker">${p.title}</div>
    <h2>${p.subtitle}</h2>
    ${p.body}
  `;
  pageSheet.classList.remove('flip-next', 'flip-prev');
  if (direction === 'next') { pageSheet.classList.add('flip-next'); }
  else if (direction === 'prev') { pageSheet.classList.add('flip-prev'); }

  readerTitle.textContent = p.subtitle;
  progressFill.style.width = ((currentPage + 1) / PAGES.length * 100) + '%';

  document.querySelectorAll('.toc-item').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.index) === currentPage);
  });

  document.getElementById('nav-prev').classList.toggle('disabled', currentPage === 0);
  document.getElementById('nav-next').classList.toggle('disabled', currentPage === PAGES.length - 1);
}

function goToPage(index, animate = true) {
  if (index < 0 || index >= PAGES.length) return;
  const direction = animate ? (index > currentPage ? 'next' : 'prev') : null;
  currentPage = index;
  renderPage(direction);
}

function nextPage() { if (currentPage < PAGES.length - 1) goToPage(currentPage + 1); }
function prevPage() { if (currentPage > 0) goToPage(currentPage - 1); }

function openTOC() { tocDrawer.classList.add('open'); tocOverlay.classList.add('show'); }
function closeTOC() { tocDrawer.classList.remove('open'); tocOverlay.classList.remove('show'); }

document.getElementById('btn-home').addEventListener('click', () => {
  readerView.classList.remove('active');
  homeView.classList.add('active');
});

document.getElementById('btn-toc').addEventListener('click', () => {
  tocDrawer.classList.contains('open') ? closeTOC() : openTOC();
});

tocOverlay.addEventListener('click', closeTOC);
document.getElementById('nav-next').addEventListener('click', nextPage);
document.getElementById('nav-prev').addEventListener('click', prevPage);

document.addEventListener('keydown', (e) => {
  if (!readerView.classList.contains('active')) return;
  if (e.key === 'ArrowLeft') nextPage();
  if (e.key === 'ArrowRight') prevPage();
  if (e.key === 'Escape') closeTOC();
});

let touchStartX = null;
document.querySelector('.page-stage').addEventListener('touchstart', (e) => {
  touchStartX = e.touches[0].clientX;
});
document.querySelector('.page-stage').addEventListener('touchend', (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) { dx < 0 ? nextPage() : prevPage(); }
  touchStartX = null;
});

function doSearch(query, inputEl) {
  if (!query) { searchMatches = []; return; }
  const q = query.trim().toLowerCase();
  searchMatches = [];
  PAGES.forEach((p, i) => {
    const text = (p.title + ' ' + p.subtitle + ' ' + p.body).toLowerCase();
    if (text.includes(q)) searchMatches.push(i);
  });
  if (searchMatches.length > 0) {
    searchIndex = 0;
    goToPage(searchMatches[0]);
    highlightInPage(query);
  }
}

function highlightInPage(query) {
  if (!query) return;
  const walker = document.createTreeWalker(pageSheet, NodeFilter.SHOW_TEXT, null);
  const regex = new RegExp('(' + query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  const nodes = [];
  let node;
  while (node = walker.nextNode()) nodes.push(node);
  nodes.forEach(n => {
    if (regex.test(n.nodeValue)) {
      const span = document.createElement('span');
      span.innerHTML = n.nodeValue.replace(regex, '<mark>$1</mark>');
      n.parentNode.replaceChild(span, n);
    }
  });
}

document.getElementById('home-search').addEventListener('input', (e) => {
  const q = e.target.value.trim();
  if (q.length < 2) return;
  const match = PAGES.findIndex(p => (p.title + p.subtitle + p.body).toLowerCase().includes(q.toLowerCase()));
  if (match >= 0) openReader(match);
});

document.getElementById('reader-search').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') doSearch(e.target.value, e.target);
});

buildHome();
buildTOC();
renderPage();
</script>
</body>
</html>
